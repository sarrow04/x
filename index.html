<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毎日フェルミ捜査 | データ探偵事務所</title>
<style>
:root {
  --paper: #E8DCC3;
  --card: #FBF7EC;
  --ink: #1F2A38;
  --stamp: #B3402E;
  --line: #C9B792;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--paper);
  background-image: repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(31,42,56,0.04) 31px, rgba(31,42,56,0.04) 32px);
  color: var(--ink);
  font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
  line-height: 1.7;
  padding: 16px 12px 60px;
}
.wrap { max-width: 640px; margin: 0 auto; }
header { text-align: center; margin-bottom: 20px; }
.agency {
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--stamp);
  font-weight: 600;
}
h1 {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 26px;
  letter-spacing: 0.12em;
  margin-top: 2px;
}
.streak {
  display: inline-block;
  margin-top: 6px;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 2px 10px;
  background: var(--card);
}
.case-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 20px 18px 18px;
  position: relative;
  box-shadow: 0 2px 6px rgba(31,42,56,0.08);
  margin-bottom: 16px;
}
.file-stamp {
  position: absolute;
  top: 10px;
  right: 12px;
  transform: rotate(6deg);
  border: 2px solid var(--stamp);
  color: var(--stamp);
  font-family: "Hiragino Mincho ProN", serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border-radius: 2px;
  opacity: 0.85;
  text-align: center;
  line-height: 1.4;
  pointer-events: none;
}
.cat-tag {
  display: inline-block;
  font-size: 11px;
  background: var(--ink);
  color: var(--card);
  padding: 1px 8px;
  border-radius: 2px;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.question {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.6;
  padding-right: 60px;
  min-height: 60px;
}
.q-actions { margin-top: 10px; }
.link-btn {
  background: none;
  border: none;
  color: var(--stamp);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  padding: 4px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  margin: 14px 0 4px;
}
input[type="text"], textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: #fff;
  font-family: inherit;
  font-size: 15px;
  padding: 8px 10px;
  color: var(--ink);
}
textarea { min-height: 90px; resize: vertical; }
textarea.calc-input { min-height: 52px; }
select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: #fff;
  font-family: inherit;
  font-size: 15px;
  padding: 8px 10px;
  color: var(--ink);
}
.stat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.stat-chip {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 3px;
  padding: 5px 9px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  color: var(--ink);
  text-align: left;
}
.stat-chip:active { background: var(--line); }
.stat-chip b { color: var(--stamp); font-family: "Courier New", monospace; margin-left: 4px; }
.stat-note { font-size: 11px; color: #6b6152; margin-top: 4px; }
.area-badge.unused { color: #6b6152; border-color: var(--line); font-weight: 400; font-size: 12px; }
.area-badge {
  display: inline-block;
  margin: 4px 0 2px;
  font-family: "Hiragino Mincho ProN", serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--stamp);
  border: 1px solid var(--stamp);
  border-radius: 3px;
  padding: 2px 12px;
  background: var(--card);
}
input:focus, textarea:focus { outline: 2px solid var(--stamp); outline-offset: 1px; }
.hint { font-size: 11px; color: #6b6152; margin-top: 3px; }
.calc-keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.calc-keys button {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 3px;
  min-width: 40px;
  padding: 8px 0;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
}
.calc-keys button:active { background: var(--line); }
.calc-keys .key-clear { color: var(--stamp); font-weight: 700; }
.var-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.var-row .var-name {
  font-size: 13px;
  font-weight: 600;
  min-width: 96px;
  border-left: 3px solid var(--stamp);
  padding-left: 6px;
}
.var-row input { flex: 1; }
.calc-result {
  font-family: "Courier New", monospace;
  font-size: 18px;
  font-weight: 700;
  background: var(--ink);
  color: var(--card);
  border-radius: 3px;
  padding: 8px 12px;
  margin-top: 6px;
  min-height: 40px;
  word-break: break-all;
}
.calc-result .calc-raw { font-size: 11px; font-weight: 400; opacity: 0.7; display: block; }
.calc-result.err { color: #E8A398; }
.calc-steps { margin-top: 4px; }
.step-line {
  font-size: 12px;
  background: var(--card);
  border-left: 3px solid var(--line);
  padding: 4px 8px;
  margin-top: 4px;
  word-break: break-all;
}
.step-line .step-val { color: var(--stamp); font-weight: 700; }
.steps-label {
  font-size: 11px;
  letter-spacing: 0.15em;
  font-weight: 700;
  color: #6b6152;
  margin-top: 10px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
}
.steps-label.concl-label { color: var(--stamp); border-bottom-color: var(--stamp); }
.step-line.concl {
  border-left-width: 4px;
  border-left-color: var(--stamp);
  background: #FBF0EC;
  font-size: 13px;
  font-weight: 600;
}
.sens-head {
  font-size: 13px;
  font-weight: 700;
  margin-top: 8px;
  padding: 6px 8px;
  background: var(--ink);
  color: var(--card);
  border-radius: 3px;
}
.sens-row { margin-top: 6px; font-size: 12px; }
.sens-row .sens-name { display: inline-block; min-width: 110px; font-weight: 600; }
.sens-bar {
  display: inline-block;
  height: 10px;
  background: var(--stamp);
  border-radius: 2px;
  vertical-align: middle;
  min-width: 2px;
}
.sens-row.top .sens-name { color: var(--stamp); }
.sens-pct { font-family: "Courier New", monospace; margin-left: 6px; }
.calc-actions { margin-top: 8px; }
.calc-actions .btn { padding: 9px 0; font-size: 13px; background: none; border: 1px solid var(--ink); color: var(--ink); }
.preview {
  white-space: pre-wrap;
  background: #fff;
  border: 1px dashed var(--line);
  border-radius: 3px;
  padding: 12px;
  font-size: 14px;
  margin-top: 6px;
  word-break: break-all;
}
.count { font-size: 12px; text-align: right; margin-top: 4px; }
.count.over { color: var(--stamp); font-weight: 700; }
.fact-check { font-size: 12px; margin-top: 4px; min-height: 16px; line-height: 1.4; }
.fact-check.ok { color: #3a7d44; font-weight: 600; }
.fact-check.ng { color: var(--stamp); font-weight: 600; }
textarea.flash-err { outline: 2px solid var(--stamp); background: #FBEDE9; }
.mode-row { display: flex; gap: 6px; }
.mode-btn {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 3px;
  padding: 8px 2px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 0.02em;
}
.mode-btn.active { background: var(--stamp); color: #fff; border-color: var(--stamp); font-weight: 700; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1;
  border: none;
  border-radius: 3px;
  padding: 12px 0;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.08em;
}
.btn-copy { background: var(--ink); color: var(--card); }
.btn-post { background: var(--stamp); color: #fff; }
.btn:active { opacity: 0.8; }
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--card);
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.history { margin-top: 24px; }
.history h2 {
  font-family: "Hiragino Mincho ProN", serif;
  font-size: 15px;
  letter-spacing: 0.1em;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 4px;
  margin-bottom: 8px;
}
.h-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 8px 12px;
  margin-bottom: 6px;
  font-size: 13px;
}
.h-item .h-date { font-size: 11px; color: #6b6152; }
.h-item .h-a { font-weight: 700; color: var(--stamp); }
footer { text-align: center; font-size: 11px; color: #6b6152; margin-top: 30px; letter-spacing: 0.1em; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="agency">データ探偵事務所</div>
    <h1>毎日フェルミ捜査</h1>
    <div id="areaBadge"></div>
    <div class="streak" id="streakBox">連続捜査 0日</div>
  </header>

  <div class="case-card">
    <div class="file-stamp" id="fileStamp">File #000<br><span id="stampDate"></span></div>
    <span class="cat-tag" id="catTag">捜査中</span>
    <div class="question" id="questionBox">読み込み中…</div>
    <div class="q-actions">
      <button class="link-btn" id="btnAnother" type="button">別の事件を捜査する</button>
      <button class="link-btn" id="btnToday" type="button">今日の事件に戻る</button>
    </div>

    <label for="areaSelect">地域データ(実数値・杉並/中野/武蔵野)</label>
    <select id="areaSelect"></select>
    <div id="areaStats"></div>

    <label for="calcInput">捜査計算機 — まず式を言葉で組む</label>
    <textarea id="calcInput" class="calc-input" placeholder="例:&#10;売上 = 客数 × 客単価&#10;客数 = 新規 + リピート"></textarea>
    <div class="hint">「= 」で 結論=因数×因数。2つ目の「名前 =」や改行キーで複数行に分けられます</div>
    <div class="calc-keys">
      <button type="button" data-k=" = ">=</button>
      <button type="button" data-k="+">+</button>
      <button type="button" data-k="−">−</button>
      <button type="button" data-k="×">×</button>
      <button type="button" data-k="÷">÷</button>
      <button type="button" data-k="(">(</button>
      <button type="button" data-k=")">)</button>
      <button type="button" data-k="万">万</button>
      <button type="button" data-k="億">億</button>
      <button type="button" data-k="%">%</button>
      <button type="button" data-k="\n">改行</button>
      <button type="button" class="key-clear" id="keyClear">C</button>
    </div>
    <div id="calcVars"></div>
    <div class="calc-result" id="calcResult">= </div>
    <div class="calc-steps" id="calcSteps"></div>
    <div class="btn-row calc-actions">
      <button class="btn" id="btnSensitivity" type="button">ボトルネック捜査</button>
    </div>
    <div id="sensBox"></div>
    <div class="btn-row calc-actions">
      <button class="btn" id="btnToAnswer" type="button">結果をA.に転記</button>
      <button class="btn" id="btnToLogic" type="button">型を追加</button>
    </div>

    <label for="logicInput">分解の型(構造式)— 投稿の主役</label>
    <textarea id="logicInput" placeholder="計算機で組んで「型を追加」すると、ここに 結論 = A × B の形で入ります"></textarea>
    <div class="hint">計算機で組んで「型を追加」で入れるのが基本。ここで直接手直しもできます</div>

    <label for="answerInput">A. 結論(任意・従来モード用)</label>
    <input type="text" id="answerInput" placeholder="例:約150時間(空欄でもOK)">

    <label>投稿スタイル</label>
    <div class="mode-row" id="modeRow">
      <button type="button" class="mode-btn active" data-mode="type">数字+型を配る</button>
      <button type="button" class="mode-btn" data-mode="full">従来(答え込み・検証用)</button>
    </div>

    <label>投稿プレビュー</label>
    <div class="preview" id="preview"></div>
    <div class="count" id="countBox">0 / 280</div>
    <div class="fact-check" id="factCheck"></div>

    <div class="btn-row">
      <button class="btn btn-copy" id="btnCopy" type="button">コピー</button>
      <button class="btn btn-post" id="btnPost" type="button">Xで投稿</button>
    </div>

    <label>インフォグラフィック用プロンプト</label>
    <div class="btn-row">
      <button class="btn" id="btnGenPrompt" type="button">プロンプト生成</button>
      <button class="btn" id="btnCopyPrompt" type="button">プロンプトをコピー</button>
    </div>
    <div class="preview" id="promptBox">「プロンプト生成」を押すと、今の計算内容から画像生成用のプロンプトを作ります</div>
  </div>

  <div class="history">
    <h2>捜査記録</h2>
    <div id="historyBox"></div>
  </div>

  <footer>
    DATA DETECTIVE AGENCY — DAILY ESTIMATION CASE FILES<br>
    <span id="verBox"></span>
  </footer>
</div>
<div class="toast" id="toast">コピーしました</div>

var EPOCH = new Date(2026, 6, 18); // 2026-07-18 = File #001
var currentIndex = 0;
var todayIndex = 0;

function daysSinceEpoch() {
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((today - EPOCH) / 86400000);
}

// 日付シードのシャッフル用LCG(同じ日は全員同じお題)
function pickIndexForDay(d) {
  var seed = (d * 2654435761) % 4294967296;
  seed = (seed ^ (seed >>> 13)) >>> 0;
  return seed % QUESTIONS.length;
}

function todayKey() {
  var n = new Date();
  return n.getFullYear() + "-" + (n.getMonth() + 1) + "-" + n.getDate();
}

  document.getElementById("btnToday").style.display = (idx === todayIndex) ? "none" : "inline";
  updatePreview();
}

var postMode = "type";

// お題の {A} を選択エリア名に置き換える
function questionText(idx) {
  var raw = QUESTIONS[idx].q;
  var nm = selectedArea ? selectedArea.n : "このエリア";
  return raw.replace(/\{A\}/g, nm);
}

// エリア名が実際に計算で使われている(またはお題が地域系)ときだけ地名を出す
function areaIsRelevant() {
  if (!selectedArea) { return false; }
  var nm = selectedArea.n;
  // お題自体が地域×HR、または設問文に地名が含まれる
  var qq = QUESTIONS[currentIndex];
  if (qq.q.indexOf("{A}") >= 0) { return true; }
  if (qq.q.indexOf(nm) >= 0) { return true; }
  // 計算式の変数名にエリア名が入っている
  var key;
  for (key in varValues) {
    if (Object.prototype.hasOwnProperty.call(varValues, key) && key.indexOf(nm) >= 0) {
      return true;
    }
  }
  var li, i, toks;
  for (li = 0; li < calcLines.length; li++) {
    toks = calcLines[li].tokens;
    for (i = 0; i < toks.length; i++) {
      if (toks[i].v && String(toks[i].v).indexOf(nm) >= 0) { return true; }
    }
  }
  return false;
}

function buildPost() {
  var a = document.getElementById("answerInput").value.trim();
  var logic = document.getElementById("logicInput").value.trim();
  var q = questionText(currentIndex);
  var lines = [];

  if (postMode === "type") {
    // 数字入りの分解を配る:名前+数字が並ぶので型と数字が同時に伝わる
    lines.push("\uD83D\uDD0D フェルミ捜査" + (areaIsRelevant() ? " — " + selectedArea.n : ""));
    lines.push(q);
    lines.push("");
    var nums = buildNumberLines();
    if (nums.length > 0) {
      var parts = buildNumberParts();
      var i;
      if (parts.mid.length > 0) {
        lines.push("【途中式】");
        for (i = 0; i < parts.mid.length; i++) { lines.push(parts.mid[i]); }
        lines.push("");
      }
      if (parts.concl.length > 0) {
        lines.push("【結論】");
        for (i = 0; i < parts.concl.length; i++) { lines.push(parts.concl[i]); }
      }
      lines.push("");
      lines.push("自社の数字に置き換えれば、そのまま使えます");
    } else {
      lines.push(logic ? logic : "(計算機で式を組んで数値を入れてください)");
      lines.push("");
      lines.push("数字は会社ごとに変わるので、当てはめてみてください");
    }
  } else {
    // 従来型(答え込み・検証用)
    lines.push("\uD83D\uDD0D フェルミ捜査 File #" + pad3(fileNo));
    lines.push(q);
    lines.push("");
    lines.push("A. " + (a || "(結論を入力)"));
    if (logic) {
      lines.push("");
      lines.push("【分解】");
      lines.push(logic);
    }
  }
  return lines.join("\n");
}

// 計算機の各行を「左辺 = 名前数字 × 名前数字 = 結果」の形で返す
function buildNumberLines() {
  var r = buildNumberParts();
  return r.mid.concat(r.concl);
}

// 途中式と結論を分けて返す
function buildNumberParts() {
  var mid = [];
  var concl = [];
  if (typeof calcLines === "undefined" || calcLines.length === 0) {
    return { mid: mid, concl: concl };
  }
  var resolved = resolveLines();
  var rootIdx = rootLineIndex();
  var li, sp, memo, r, v, i;
  for (li = 0; li < calcLines.length; li++) {
    sp = splitLine(calcLines[li].tokens);
    if (sp.rhs.length === 0) { continue; }
    r = rhsToExpr(sp.rhs, resolved);
    if (r.missing > 0) { continue; }
    v = evalExpr(r.expr);
    if (v === null || isNaN(v)) { continue; }
    memo = "";
    for (i = 0; i < sp.rhs.length; i++) { memo += memoPieceResolved(sp.rhs[i], resolved); }
    var line = (sp.label || "結論") + " = " + memo + " = " + formatJP(v);
    if (li === rootIdx) { concl.push(line); } else { mid.push(line); }
  }
  return { mid: mid, concl: concl };
}

// ---- ボトルネック捜査(感度分析)----
// 他の行から参照されていない左辺(=最終結論)の行を探す
function rootLineIndex() {
  if (calcLines.length === 0) { return -1; }
  var used = {};
  var li, i, sp;
  for (li = 0; li < calcLines.length; li++) {
    sp = splitLine(calcLines[li].tokens);
    for (i = 0; i < sp.rhs.length; i++) {
      if (sp.rhs[i].t === "var") { used[sp.rhs[i].v] = true; }
    }
  }
  // 参照されていない左辺の候補を集める
  var candidates = [];
  for (li = 0; li < calcLines.length; li++) {
    sp = splitLine(calcLines[li].tokens);
    if (sp.label && !used[sp.label] && sp.rhs.length > 0) { candidates.push(li); }
  }
  // 候補が複数(=行同士が参照し合っていない書き方)なら、最後に書いた行を結論とみなす
  if (candidates.length > 0) { return candidates[candidates.length - 1]; }
  return calcLines.length - 1;
}

// 最終行の値を求める。values を渡すとその値セットで計算
function finalValue(values) {
  var saved = varValues;
  if (values) { varValues = values; }
  var result = null;
  try {
    var idx = rootLineIndex();
    if (idx >= 0) {
      var resolved = resolveLines();
      var root = splitLine(calcLines[idx].tokens);
      if (root.rhs.length > 0) {
        var r = rhsToExpr(root.rhs, resolved);
        if (r.missing === 0) {
          var v = evalExpr(r.expr);
          if (v !== null && !isNaN(v)) { result = v; }
        }
      }
    }
  } catch (e) { result = null; }
  varValues = saved;
  return result;
}

// 各因数を10%改善したとき、最終結果が何%動くかを比較
function runSensitivity() {
  var box = document.getElementById("sensBox");
  var base = finalValue(null);
  if (base === null || base === 0) {
    box.innerHTML = '<div class="sens-head">先に式を組んで、数値を全部入れてください</div>';
    return;
  }
  var list = varList();
  if (list.length === 0) {
    box.innerHTML = '<div class="sens-head">因数がありません</div>';
    return;
  }
  var rows = [];
  var i;
  for (i = 0; i < list.length; i++) {
    var name = list[i];
    var numStr = valueParse(varValues[name]);
    if (numStr === null) { continue; }
    var baseNum = evalExpr(numStr);
    if (baseNum === null || isNaN(baseNum) || baseNum === 0) { continue; }
    // 10%増やした場合
    var mod = {};
    var key;
    for (key in varValues) {
      if (Object.prototype.hasOwnProperty.call(varValues, key)) { mod[key] = varValues[key]; }
    }
    mod[name] = String(baseNum * 1.1);
    var newVal = finalValue(mod);
    if (newVal === null) { continue; }
    var pct = ((newVal - base) / base) * 100;
    rows.push({ name: name, pct: pct, abs: Math.abs(pct) });
  }
  if (rows.length === 0) {
    box.innerHTML = '<div class="sens-head">数値を入れると効き目を比較できます</div>';
    return;
  }
  rows.sort(function (a, b) { return b.abs - a.abs; });
  var max = rows[0].abs || 1;
  var html = '<div class="sens-head">効くのは「' + esc(rows[0].name) + '」'
    + '(10%動かすと結果が' + rows[0].pct.toFixed(1) + '%変わる)</div>';
  var j;
  for (j = 0; j < rows.length; j++) {
    var w = Math.round((rows[j].abs / max) * 130);
    html += '<div class="sens-row' + (j === 0 ? " top" : "") + '">'
      + '<span class="sens-name">' + esc(rows[j].name) + "</span>"
      + '<span class="sens-bar" style="width:' + w + 'px"></span>'
      + '<span class="sens-pct">' + (rows[j].pct >= 0 ? "+" : "") + rows[j].pct.toFixed(1) + "%</span>"
      + "</div>";
  }
  html += '<div class="hint">各因数を10%動かしたときの最終結果への影響。上ほど効くレバー(=ボトルネック)</div>';
  box.innerHTML = html;
}

// memoPiece の解決版:他行で算出された値も名前の後ろに出す
function memoPieceResolved(tk, resolved) {
  if (tk.t === "op") { return tk.d; }
  if (tk.t === "num") { return tk.v; }
  if (tk.t === "label") { return tk.v; }
  if (tk.t === "eq") { return " = "; }
  if (varValues[tk.v]) { return tk.v + varValues[tk.v]; }
  if (resolved && typeof resolved[tk.v] === "number") { return tk.v + formatJP(resolved[tk.v]); }
  return tk.v;
}

// 因数分解チェック:型モードでは各行が「左辺 = 右辺」でないと投稿を止める
function checkFactorization() {
  if (postMode !== "type") { return { ok: true }; }
  // 計算機から数字入りの分解が作れていればOK
  if (buildNumberLines().length > 0) { return { ok: true }; }
  var logic = document.getElementById("logicInput").value;
  var rawLines = logic.split("\n");
  var lines = [];
  var i, ln;
  for (i = 0; i < rawLines.length; i++) {
    if (rawLines[i].replace(/[\s\u3000]/g, "") !== "") { lines.push(rawLines[i]); }
  }
  if (lines.length === 0) {
    return { ok: false, msg: "計算機で式を組んで数値を入れてください(または分解メモに 結論 = A × B)" };
  }
  for (i = 0; i < lines.length; i++) {
    ln = lines[i];
    var eqCount = (ln.match(/[=\uFF1D]/g) || []).length;
    if (eqCount === 0) {
      return { ok: false, msg: "「= がない行があります → " + trimLabel(ln) + "」。因数分解は 左辺 = 右辺 の形で" };
    }
    if (eqCount > 1) {
      return { ok: false, msg: "「= が多すぎる行があります → " + trimLabel(ln) + "」。1行に = は1つ" };
    }
    var parts = ln.split(/[=\uFF1D]/);
    var left = parts[0].replace(/[\s\u3000]/g, "");
    var right = parts[1].replace(/[\s\u3000]/g, "");
    if (!left) {
      return { ok: false, msg: "左辺(結論)が空の行があります → " + trimLabel(ln) };
    }
    if (!right) {
      return { ok: false, msg: "右辺(因数)が空の行があります → " + trimLabel(ln) };
    }
    // 右辺に因数分解らしさ(演算子)があるか — 単項でも許容するが掛け算等を推奨
    if (!/[×÷*\/\+\u2212\-]/.test(right) && lines.length === 1) {
      return { ok: false, msg: "右辺を因数に分けてください → " + trimLabel(ln) + "(例: = A × B)" };
    }
  }
  return { ok: true };
}

function trimLabel(s) {
  s = s.replace(/^[\s\u3000]+|[\s\u3000]+$/g, "");
  return (s.length > 14) ? s.slice(0, 14) + "…" : s;
}

// X加重文字数(全角2・半角1、上限280)
function weightedLength(str) {
  var total = 0;
  var i = 0;
  while (i < str.length) {
    var code = str.codePointAt(i);
    if (code <= 0x10FF || (code >= 0x2000 && code <= 0x200A) || code === 0x000A) {
      total += 1;
    } else {
      total += 2;
    }
    i += (code > 0xFFFF) ? 2 : 1;
  }
  return total;
}

function updatePreview() {
  var text = buildPost();
  document.getElementById("preview").textContent = text;
  var len = weightedLength(text);
  var box = document.getElementById("countBox");
  box.textContent = len + " / 280";
  box.className = (len > 280) ? "count over" : "count";
  if (typeof refreshAreaBadge === "function") { refreshAreaBadge(); }
  var chk = checkFactorization();

    fb.textContent = "";

  } else if (chk.ok) {
    fb.textContent = "✓ 因数分解OK(左辺 = 右辺の形)";
    fb.className = "fact-check ok";
  } else {
    fb.textContent = "⚠ " + chk.msg;
    fb.className = "fact-check ng";
  }
}

function pad3(n) {

function esc(s) {

}

// ---- 捜査計算機 ----
var lastCalcValue = null;
var calcTokens = [];
var calcLines = [];
var varValues = {};
var lastVarKey = "";

function normalizeExpr(s) {
  var zen = "0123456789";
  var out = "";
  var i;
  for (i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    var z = zen.indexOf(ch);
    if (z >= 0) { out += String(z); continue; }
    if (ch === "×" || ch === "*") { out += "*"; continue; }
    if (ch === "÷" || ch === "/") { out += "/"; continue; }
    if (ch === "−" || ch === "-" || ch === "ー") { out += "-"; continue; }
    if (ch === "+" || ch === "+") { out += "+"; continue; }
    if (ch === "(" || ch === "(") { out += "("; continue; }
    if (ch === ")" || ch === ")") { out += ")"; continue; }
    if (ch === "." || ch === ".") { out += "."; continue; }
    if (ch === "," || ch === "、" || ch === " " || ch === "\u3000") { continue; }
    if (ch === "万") { out += "*10000"; continue; }
    if (ch === "億") { out += "*100000000"; continue; }
    if (ch === "%" || ch === "%") { out += "/100"; continue; }
    out += ch;
  }
  return out;
}

function evalExpr(raw) {
  var n = normalizeExpr(raw);
  if (!n) { return null; }
  if (!/^[0-9+\-*/().]+$/.test(n)) { return NaN; }
  try {
    var v = Function('"use strict"; return (' + n + ');')();
    return (typeof v === "number" && isFinite(v)) ? v : NaN;
  } catch (e) {
    return NaN;
  }
}

function roundSig(v, sig) {
  if (v === 0) { return 0; }
  var d = Math.ceil(Math.log(Math.abs(v)) / Math.LN10);
  var p = Math.pow(10, sig - d);
  return Math.round(v * p) / p;
}

function formatJP(v) {
  var abs = Math.abs(v);
  var s;
  if (abs >= 100000000) {
    s = String(roundSig(v / 100000000, 3)) + "億";
  } else if (abs >= 10000) {
    s = String(roundSig(v / 10000, 3)) + "万";
  } else if (abs >= 100) {
    s = String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  } else {
    s = String(roundSig(v, 3));
  }
  return s;
}

function parseTemplate(s) {
  var tokens = [];
  var buf = "";
  var i, ch, mapped, disp;
  function flush() {
    var t = buf.replace(/^\s+|\s+$/g, "");
    buf = "";
    if (!t) { return; }
    if (/^[0-9\uFF10-\uFF19.,\uFF0E\u3001\uFF0C\u4E07\u5104%\uFF05\s]+$/.test(t)) {
      tokens.push({ t: "num", v: t });
    } else {
      tokens.push({ t: "var", v: t });
    }
  }
  for (i = 0; i < s.length; i++) {
    ch = s.charAt(i);
    mapped = null;
    disp = "";
    if (ch === "\u00D7" || ch === "*") { mapped = "*"; disp = "\u00D7"; }
    else if (ch === "\u00F7" || ch === "/") { mapped = "/"; disp = "\u00F7"; }
    else if (ch === "\u2212" || ch === "-") { mapped = "-"; disp = "\u2212"; }
    else if (ch === "+" || ch === "\uFF0B") { mapped = "+"; disp = "+"; }
    else if (ch === "(" || ch === "\uFF08") { mapped = "("; disp = "("; }
    else if (ch === ")" || ch === "\uFF09") { mapped = ")"; disp = ")"; }
    else if (ch === "=" || ch === "\uFF1D") { mapped = "="; disp = "="; }
    if (mapped) {
      flush();
      if (mapped === "=") {
        tokens.push({ t: "eq", v: "=", d: "=" });
      } else {
        tokens.push({ t: "op", v: mapped, d: disp });
      }
    } else {
      buf += ch;
    }
  }
  flush();
  return tokens;
}

function markLabels(tokens) {
  var i;
  for (i = 0; i < tokens.length; i++) {
    // 名前( の名前はラベル
    if (tokens[i].t === "var" && tokens[i + 1] && tokens[i + 1].t === "op" && tokens[i + 1].v === "(") {
      tokens[i].t = "label";
    }
    // = の直前(左辺=結論)はラベル
    if (tokens[i].t === "eq") {
      var j = i - 1;
      if (j >= 0 && (tokens[j].t === "var" || tokens[j].t === "num")) {
        tokens[j].t = "label";
      }
    }
  }
  return tokens;
}

function varList() {
  // 全行から変数を集約。ただし、いずれかの行で左辺(結論)として定義された名前は
  // 入力欄を作らない(それは別の行の計算結果で埋まるため)
  var defined = {};
  var li, i, toks;
  for (li = 0; li < calcLines.length; li++) {
    toks = calcLines[li].tokens;
    for (i = 0; i < toks.length; i++) {
      if (toks[i].t === "eq" && i > 0 && toks[i - 1].t === "label") {
        defined[toks[i - 1].v] = true;
      }
    }
  }
  var seen = {};
  var list = [];
  for (li = 0; li < calcLines.length; li++) {
    toks = calcLines[li].tokens;
    for (i = 0; i < toks.length; i++) {
      if (toks[i].t === "var" && !seen[toks[i].v] && !defined[toks[i].v]) {
        seen[toks[i].v] = true;
        list.push(toks[i].v);
      }
    }
  }
  return list;
}

function renderVarInputs() {
  var list = varList();
  var key = list.join("|");
  if (key === lastVarKey) { return; }
  lastVarKey = key;
  var box = document.getElementById("calcVars");
  var html = "";
  var i;
  for (i = 0; i < list.length; i++) {
    html += '<div class="var-row"><span class="var-name">' + esc(list[i]) + '</span>'
      + '<input type="text" data-var="' + esc(list[i]) + '" placeholder="50件・8分・5.6万円 単位OK"></div>';
  }
  box.innerHTML = html;
  var inputs = box.querySelectorAll("input");
  for (i = 0; i < inputs.length; i++) {
    if (varValues[inputs[i].getAttribute("data-var")]) {
      inputs[i].value = varValues[inputs[i].getAttribute("data-var")];
    }
    inputs[i].addEventListener("input", function () {
      varValues[this.getAttribute("data-var")] = this.value;
      computeCalc();
      updatePreview();
    });
  }
}

// 「50件」「5.6万円」→ 計算用の数値部分だけ抜き出す(単位は表示用に残る)
function valueParse(raw) {
  if (!raw) { return null; }
  var zen = "\uFF10\uFF11\uFF12\uFF13\uFF14\uFF15\uFF16\uFF17\uFF18\uFF19";
  var t = "";
  var i, ch, z;
  for (i = 0; i < raw.length; i++) {
    ch = raw.charAt(i);
    z = zen.indexOf(ch);
    t += (z >= 0) ? String(z) : ch;
  }
  t = t.replace(/[,\uFF0C\u3001\s\u3000]/g, "").replace(/\uFF0E/g, ".");
  var m = t.match(/^-?[0-9]*\.?[0-9]+(\u4E07|\u5104)?(%|\uFF05)?/);
  if (!m || !m[0]) { return null; }
  return m[0];
}

function exprPiece(tk) {
  if (tk.t === "op") { return tk.v; }
  if (tk.t === "num") { return "(" + tk.v + ")"; }
  if (tk.t === "label") { return ""; }
  if (tk.t === "eq") { return ""; }
  var nm = valueParse(varValues[tk.v]);
  return (nm === null) ? null : "(" + nm + ")";
}

function memoPiece(tk) {
  if (tk.t === "op") { return tk.d; }
  if (tk.t === "num") { return tk.v; }
  if (tk.t === "label") { return tk.v; }
  if (tk.t === "eq") { return " = "; }
  return tk.v + (varValues[tk.v] || "?");
}

// 型:名前と演算子だけ(数値は載せない)
function typePiece(tk) {
  if (tk.t === "op") { return tk.d; }
  if (tk.t === "num") { return tk.v; }
  if (tk.t === "eq") { return " = "; }
  return tk.v;
}

// 1行のトークンを {label, rhs} に分解
function splitLine(tokens) {
  var eqIdx = -1;
  var k;
  for (k = 0; k < tokens.length; k++) {
    if (tokens[k].t === "eq") { eqIdx = k; }
  }
  if (eqIdx < 0) { return { label: "", rhs: tokens }; }
  var label = "";
  var p;
  for (p = 0; p < eqIdx; p++) {
    if (tokens[p].t === "label" || tokens[p].t === "var" || tokens[p].t === "num") {
      label += tokens[p].v;
    }
  }
  return { label: label, rhs: tokens.slice(eqIdx + 1) };
}

// 右辺トークンを式文字列に。resolved は他行で確定した左辺値のマップ
function rhsToExpr(rhs, resolved) {
  var expr = "";
  var missingCount = 0;
  var i, tk, piece, rv;
  for (i = 0; i < rhs.length; i++) {
    tk = rhs[i];
    if (tk.t === "op") { expr += tk.v; continue; }
    if (tk.t === "num") { expr += "(" + tk.v + ")"; continue; }
    if (tk.t === "eq") { continue; }
    if (tk.t === "label") { expr += ""; continue; }
    // var: まず数値入力、なければ他行の確定値
    var nm = valueParse(varValues[tk.v]);
    if (nm !== null) { expr += "(" + nm + ")"; continue; }
    if (resolved && typeof resolved[tk.v] === "number") { expr += "(" + resolved[tk.v] + ")"; continue; }
    missingCount++;
    expr += "(0)";
  }
  return { expr: expr, missing: missingCount };
}

function computeCalc() {
  var box = document.getElementById("calcResult");
  if (calcLines.length === 0) {
    lastCalcValue = null;
    box.className = "calc-result";
    box.textContent = "= ";
    renderSteps();
    return;
  }
  renderSteps();
  // 最終行(または唯一の行)の結果を大きく表示
  var resolved = resolveLines();
  var last = splitLine(calcLines[Math.max(0, rootLineIndex())].tokens);
  if (last.rhs.length === 0) {
    lastCalcValue = null;
    box.className = "calc-result";
    box.textContent = "= 右辺を入力";
    return;
  }
  var r = rhsToExpr(last.rhs, resolved);
  if (r.missing > 0) {
    lastCalcValue = null;
    box.className = "calc-result";
    box.textContent = "= 数値待ち(あと" + r.missing + "項目)";
    return;
  }
  var v = evalExpr(r.expr);
  if (v === null || isNaN(v)) {
    lastCalcValue = null;
    box.className = "calc-result err";
    box.textContent = "= 式を確認";
    return;
  }
  lastCalcValue = v;
  box.className = "calc-result";
  var prefix = last.label ? (esc(last.label) + " = ") : "= ";
  box.innerHTML = prefix + esc(formatJP(v)) + '<span class="calc-raw">' + esc(String(v)) + "</span>";
}

// 各行の左辺=右辺を、依存を解決しながら数回パスで確定
function resolveLines() {
  var resolved = {};
  var pass;
  for (pass = 0; pass < calcLines.length + 1; pass++) {
    var changed = false;
    var li;
    for (li = 0; li < calcLines.length; li++) {
      var sp = splitLine(calcLines[li].tokens);
      if (!sp.label || typeof resolved[sp.label] === "number") { continue; }
      var r = rhsToExpr(sp.rhs, resolved);
      if (r.missing > 0) { continue; }
      var v = evalExpr(r.expr);
      if (v !== null && !isNaN(v)) { resolved[sp.label] = v; changed = true; }
    }
    if (!changed) { break; }
  }
  return resolved;
}

// ()のグループを内側から順に拾う(直前がラベルなら名前付き)
function findGroups(tokens) {
  var groups = [];
  var stack = [];
  var i;
  for (i = 0; i < tokens.length; i++) {
    if (tokens[i].t === "op" && tokens[i].v === "(") {
      stack.push({ start: i, label: (i > 0 && tokens[i - 1].t === "label") ? tokens[i - 1].v : null });
    } else if (tokens[i].t === "op" && tokens[i].v === ")") {
      var g = stack.pop();
      if (g) { g.end = i; groups.push(g); }
    }
  }
  return groups;
}

function renderSteps() {
  var box = document.getElementById("calcSteps");
  if (calcLines.length === 0) { box.innerHTML = ""; return; }
  var resolved = resolveLines();
  var rootIdx = rootLineIndex();
  var mid = "";
  var concl = "";
  var li, sp, memo, r, v, valTxt, i;
  for (li = 0; li < calcLines.length; li++) {
    sp = splitLine(calcLines[li].tokens);
    if (sp.rhs.length === 0) { continue; }
    memo = "";
    for (i = 0; i < sp.rhs.length; i++) { memo += memoPieceResolved(sp.rhs[i], resolved); }
    r = rhsToExpr(sp.rhs, resolved);
    if (r.missing > 0) {
      valTxt = "数値待ち";
    } else {
      v = evalExpr(r.expr);
      valTxt = (v === null || isNaN(v)) ? "式を確認" : formatJP(v);
    }
    var name = sp.label ? sp.label : "(結論)";
    var row = '<div class="step-line' + (li === rootIdx ? " concl" : "") + '">'
      + '<span class="step-val">' + esc(name) + "</span> = "
      + esc(memo) + ' = <span class="step-val">' + esc(valTxt) + "</span></div>";
    if (li === rootIdx) { concl += row; } else { mid += row; }
  }
  var html = "";
  if (mid) { html += '<div class="steps-label">途中式</div>' + mid; }
  if (concl) { html += '<div class="steps-label concl-label">結論</div>' + concl; }
  box.innerHTML = html;
}

function updateCalc() {
  var raw = document.getElementById("calcInput").value;
  calcLines = tokenizeLines(raw);
  // 後方互換:単一トークン列としても保持(先頭行)
  calcTokens = calcLines.length ? calcLines[0].tokens : [];
  renderVarInputs();
  computeCalc();
  updatePreview();
}

// 入力を行に分割してトークン化。2つ目以降の「名前 =」は自動で改行扱い
function tokenizeLines(raw) {
  // まず手動改行で分割
  var chunks = raw.split("\n");
  var lines = [];
  var c;
  for (c = 0; c < chunks.length; c++) {
    var toks = markLabels(parseTemplate(chunks[c]));
    // 1行の中に = が2つ以上 → 2つ目の = の直前ラベルの手前で分割
    var segments = splitByExtraEquals(toks);
    var s;
    for (s = 0; s < segments.length; s++) {
      if (segments[s].length > 0) {
        lines.push({ tokens: segments[s] });
      }
    }
  }
  return lines;
}

// トークン列に = が複数あれば、2つ目以降の「ラベル =」の直前で切る
function splitByExtraEquals(tokens) {
  var eqPositions = [];
  var i;
  for (i = 0; i < tokens.length; i++) {
    if (tokens[i].t === "eq") { eqPositions.push(i); }
  }
  if (eqPositions.length <= 1) { return [tokens]; }

  // 2つ目以降の = の直前ラベルに内部スペースがあれば、最後の語を新しい行のラベルに分離
  // (例: 「客単価 客数」= → 前行末尾に「客単価」、新行ラベルに「客数」)
  var work = [];
  for (i = 0; i < tokens.length; i++) {
    var tk = tokens[i];
    var isBeforeExtraEq = (i + 1 < tokens.length && tokens[i + 1].t === "eq"
      && eqPositions.indexOf(i + 1) >= 1);
    if (isBeforeExtraEq && (tk.t === "label" || tk.t === "var")
        && /[\s\u3000]/.test(tk.v.replace(/^[\s\u3000]+|[\s\u3000]+$/g, ""))) {
      var trimmed = tk.v.replace(/^[\s\u3000]+|[\s\u3000]+$/g, "");
      var lastSp = Math.max(trimmed.lastIndexOf(" "), trimmed.lastIndexOf("\u3000"));
      var head = trimmed.slice(0, lastSp).replace(/[\s\u3000]+$/g, "");
      var tail = trimmed.slice(lastSp + 1);
      if (head) { work.push({ t: "var", v: head, __splitHead: true }); }
      work.push({ t: "label", v: tail });
    } else {
      work.push(tk);
    }
  }
  // work上で = 位置を取り直して分割
  var eqPos2 = [];
  for (i = 0; i < work.length; i++) { if (work[i].t === "eq") { eqPos2.push(i); } }
  var cuts = [];
  var e;
  for (e = 1; e < eqPos2.length; e++) {
    var cut = eqPos2[e] - 1;
    if (cut > 0) { cuts.push(cut); }
  }
  var segs = [];
  var start = 0;
  var k;
  for (k = 0; k < cuts.length; k++) {
    segs.push(work.slice(start, cuts[k]));
    start = cuts[k];
  }
  segs.push(work.slice(start));
  return segs;
}

function buildMemoLine() {
  var out = "";
  var i;
  for (i = 0; i < calcTokens.length; i++) {
    out += memoPiece(calcTokens[i]);
  }
  return out;
}

function insertKey(k) {
  if (k === "\\n") { k = "\n"; }
  var el = document.getElementById("calcInput");
  var start = (typeof el.selectionStart === "number") ? el.selectionStart : el.value.length;
  var end = (typeof el.selectionEnd === "number") ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + k + el.value.slice(end);
  var pos = start + k.length;
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e) {}
  updateCalc();
}

// 分解メモにカーソル位置で文字を挿入
function insertIntoLogic(str) {
  var el = document.getElementById("logicInput");
  var start = (typeof el.selectionStart === "number") ? el.selectionStart : el.value.length;
  var end = (typeof el.selectionEnd === "number") ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  var pos = start + str.length;
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e) {}
  updatePreview();
}

function calcToAnswer() {
  if (lastCalcValue === null) { showToast("先に式を入力"); return; }
  document.getElementById("answerInput").value = "約" + formatJP(lastCalcValue);
  updatePreview();
  showToast("A.に転記しました");
}

function buildTypeLine() {
  var out = "";
  var i;
  for (i = 0; i < calcTokens.length; i++) {
    out += typePiece(calcTokens[i]);
  }
  return out;
}

function calcToLogic() {
  if (calcLines.length === 0) { showToast("先に式を組んで"); return; }
  var newLines = buildFactorLines();
  if (newLines.length === 0) { showToast("先に式を組んで"); return; }
  var logic = document.getElementById("logicInput");
  var existing = logic.value.split("\n");
  var norm = function (s) { return s.replace(/[\s\u3000]/g, ""); };
  var added = 0;
  var dup = 0;
  var li, j, isDup;
  for (li = 0; li < newLines.length; li++) {
    isDup = false;
    for (j = 0; j < existing.length; j++) {
      if (norm(existing[j]) === norm(newLines[li])) { isDup = true; break; }
    }
    if (isDup) { dup++; continue; }
    logic.value = logic.value.replace(/[\s\u3000]+$/, "");
    logic.value = logic.value ? (logic.value + "\n" + newLines[li]) : newLines[li];
    existing.push(newLines[li]);
    added++;
  }
  updatePreview();
  if (added === 0) {
    showToast("同じ型がすでにあります");
    flashLogic();
  } else {
    showToast(added + "行の型を追記" + (dup ? "(重複" + dup + "行は除外)" : ""));
  }
}

// 計算機の各行を「左辺 = 右辺」の因数分解行に整形して配列で返す
function buildFactorLines() {
  var out = [];
  var li;
  for (li = 0; li < calcLines.length; li++) {
    var line = factorLineFromTokens(calcLines[li].tokens);
    if (line) { out.push(line); }
  }
  return out;
}

function factorLineFromTokens(tokens) {
  var n = tokens.length;
  if (n === 0) { return ""; }
  // 既に = を含む → typeで整形して返す
  var hasEq = false, i;
  for (i = 0; i < n; i++) { if (tokens[i].t === "eq") { hasEq = true; break; } }
  if (hasEq) {
    var out = "";
    for (i = 0; i < n; i++) { out += typePiece(tokens[i]); }
    return out;
  }
  // 「名前(式)」形 → 名前 = 式
  if (n >= 3 && tokens[0].t === "label" && tokens[1].t === "op" && tokens[1].v === "("
      && tokens[n - 1].t === "op" && tokens[n - 1].v === ")") {
    var depth = 0, matched = true;
    for (i = 1; i < n; i++) {
      if (tokens[i].t === "op" && tokens[i].v === "(") { depth++; }
      else if (tokens[i].t === "op" && tokens[i].v === ")") {
        depth--;
        if (depth === 0 && i !== n - 1) { matched = false; break; }
      }
    }
    if (matched) {
      var inner = "";
      for (i = 2; i < n - 1; i++) { inner += typePiece(tokens[i]); }
      return tokens[0].v + " = " + inner;
    }
  }
  // それ以外 → 結論 = 右辺
  var right = "";
  for (i = 0; i < n; i++) { right += typePiece(tokens[i]); }
  return "結論 = " + right;
}
